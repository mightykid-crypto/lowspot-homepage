# 라이브톡 실시간 서버 — lowspot.net/api/live/* 에만 붙는다 (홈페이지 Pages 는 그대로)
name = "lowspot-live"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 같은 주소(lowspot.net) 아래 이 경로만 이 Worker 로 보낸다 → 새 하위 주소·DNS 기록이 필요 없다
routes = [
  { pattern = "lowspot.net/api/live/*", zone_name = "lowspot.net" }
]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]
